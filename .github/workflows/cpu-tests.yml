name: CPU reference tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU dependencies
        run: python -m pip install -r requirements.txt
      - name: Run independent reference tests
        run: python -m unittest discover -s tests -v
      - name: Verify the exercise catalog
        run: python -m workbook.judge list
